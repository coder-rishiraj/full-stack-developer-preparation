<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Career Duo — Software Engineering, Taught Properly</title>
    <meta name="description" content="Career Duo: a structured software engineering curriculum — DSA, frontend, Java backend, system design and applied AI — taught as complete lessons." />
    <script>
      ;(function () {
        try {
          var a = JSON.parse(localStorage.getItem('cd-appearance') || '{}')
          var t = a.theme || 'system'
          if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          var r = document.documentElement
          r.dataset.theme = t
          if (a.font) r.dataset.font = a.font
          if (a.size) r.dataset.textSize = a.size
          if (a.measure) r.dataset.measure = a.measure
        } catch (e) {}
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
